name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm     # free hosted ARM64 runner for public repos
    steps:
      - uses: actions/checkout@v4

      - name: Build static binary
        run: |
          gcc -O3 -static -s main.c -o udp-broadcast-relay-redux-linux-arm64
          file udp-broadcast-relay-redux-linux-arm64   # should say: ARM aarch64, statically linked

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: udp-broadcast-relay-redux-linux-arm64

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest        # packaging only, arch doesn't matter here
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-arm64
          path: dist

      - run: cd dist && sha256sum * > checksums-sha256.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
