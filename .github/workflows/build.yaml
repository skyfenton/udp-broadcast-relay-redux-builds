name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}   # manual runs: binaries available as run artifacts

permissions:
  contents: write         # required to create the GitHub Release

env:
  PROGRAM: udp-broadcast-relay-redux

jobs:
  build:
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest          # was ubuntu-22.04 (retired label -> stuck queued)
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-arm64         # UniFi OS consoles (UDM/UDR/UDM Pro/SE/UNVR/CKG2+/UXG)
            toolchain: aarch64-linux-musl-cross

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download musl toolchain
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors \
            -o "${{ matrix.toolchain }}.tgz" \
            "https://musl.cc/${{ matrix.toolchain }}.tgz"
          tar -xzf "${{ matrix.toolchain }}.tgz"
          rm -f "${{ matrix.toolchain }}.tgz"

      - name: Compile static binary
        run: |
          set -euo pipefail
          TARGET="${{ matrix.toolchain }}"
          TARGET="${TARGET%-cross}"        # aarch64-linux-musl-cross -> aarch64-linux-musl
          CC="$TARGET/bin/$TARGET-gcc"
          "$CC" -O3 -Wall -static -s \
            -o "$PROGRAM-${{ matrix.id }}" main.c
          file "$PROGRAM-${{ matrix.id }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: ${{ env.PROGRAM }}-${{ matrix.id }}

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum * > checksums-sha256.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Statically linked (musl) builds of `${{ env.PROGRAM }}`.
            Verify downloads against `checksums-sha256.txt`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
