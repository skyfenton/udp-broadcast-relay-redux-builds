name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # manual runs -> rolling "latest" release

permissions:
  contents: write           # allows the built-in token to create releases

jobs:
  build:
    runs-on: ubuntu-24.04-arm     # free hosted ARM64 runner (public repo)
    steps:
      - uses: actions/checkout@v6

      - name: Build static binary
        run: |
          gcc -O3 -static -s main.c -o udp-broadcast-relay-redux-linux-arm64
          sha256sum udp-broadcast-relay-redux-linux-arm64 > checksums-sha256.txt
          file udp-broadcast-relay-redux-linux-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-arm64
          path: |
            udp-broadcast-relay-redux-linux-arm64
            checksums-sha256.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}   # built-in token, no setup needed
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            TITLE="udp-broadcast-relay-redux $TAG"
          else
            TAG="latest"
            TITLE="Latest build (run #$GITHUB_RUN_NUMBER)"
            # replace the previous rolling "latest" release
            gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "Static arm64 (aarch64) build of $GITHUB_SHA. Verify with: sha256sum -c checksums-sha256.txt" \
            udp-broadcast-relay-redux-linux-arm64 checksums-sha256.txt
